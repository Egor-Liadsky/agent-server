[package]
name = "agentd"
version = "0.1.0"
edition = "2024"

[dependencies]
agentcore = { git = "https://github.com/Egor-Liadsky/agent-cli", branch = "main" }
agentupstream = { git = "https://github.com/Egor-Liadsky/agent-cli", branch = "main" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
